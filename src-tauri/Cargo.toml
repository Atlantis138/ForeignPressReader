[package]
name = "foreign-press-reader"
version = "1.0.0"
description = "Tauri mobile shell for Foreign Press Reader"
authors = ["Atlantis138"]
license = "MIT"
repository = "https://github.com/Atlantis138/ForeignPressReader"
edition = "2021"
rust-version = "1.77.2"

[features]
portable-interop = []

[[bin]]
name = "portable-interop"
path = "src/bin/portable_interop.rs"
required-features = ["portable-interop"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "foreign_press_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
axum = "0.7"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1.3"
hex = "0.4"
fs2 = "0.4"
http-body-util = "0.1"
image = { version = "=0.25.5", default-features = false, features = ["jpeg", "png", "webp"] }
percent-encoding = "2.3"
regex = "1.11"
rcgen = { version = "0.13", features = ["pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2.11.3", features = [] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["fs", "io-util", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["time"] }
uuid = { version = "1.0", features = ["v4"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
fpr-platform-plugin = { path = "plugins/fpr-platform" }

[dev-dependencies]
tempfile = "3.0"
